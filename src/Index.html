<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renew Group Recruitment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0d4a3a;--g2:#16624d;--gl:#e7f2ee;--gold:#b88a3a;--goldl:#f7efe1;--ink:#1c2a26;--mut:#62716c;--line:#dde5e2;--bg:#f5f7f6;--card:#fff;
--red:#c0392b;--redl:#fdecea;--amb:#b7791f;--ambl:#fdf3e1;--blue:#2b6cb0;--bluel:#e8f0fb;--pur:#6b46c1;--purl:#f0ebfb;--grey:#718096;--greyl:#edf0f2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g2)}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0d4a3a 0%,#16624d 60%,#b88a3a 140%)}
.lcard{background:#fff;border-radius:16px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lcard img{display:block;width:210px;margin:0 auto 10px}
.lcard h1{font-size:18px;text-align:center;margin:4px 0 18px;color:var(--g)}
/* forms */
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.f{margin-bottom:12px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(22,98,77,.12)}
input:disabled,select:disabled,textarea:disabled{background:#f3f5f4;color:#5c6a65}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 14px}
.full{grid-column:1/-1}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--g2)}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--line)}
.btn.sec:hover{background:var(--gl)}
.btn.gold{background:var(--gold)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f1c7c2}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:wait}
.err{background:var(--redl);color:var(--red);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
/* shell */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hbar{display:flex;align-items:center;gap:14px;padding:8px 18px;max-width:1300px;margin:0 auto}
.hbar img{height:40px}
.hbar .t{font-weight:700;color:var(--g);font-size:15px;line-height:1.2}
.hbar .t small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.sp{flex:1}
.who{text-align:right;font-size:12.5px;line-height:1.3}
.who b{display:block}
.role{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;background:var(--goldl);color:#8a6420}
nav{display:flex;gap:4px;padding:0 18px;max-width:1300px;margin:0 auto;overflow-x:auto}
nav button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--gold)}
main{max-width:1300px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--g)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--g)}
.kpi .n{font-size:26px;font-weight:700;color:var(--g)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:500}
.kpi.red{border-left-color:var(--red)}.kpi.red .n{color:var(--red)}
.kpi.gold{border-left-color:var(--gold)}.kpi.gold .n{color:#8a6420}
.kpi.blue{border-left-color:var(--blue)}.kpi.blue .n{color:var(--blue)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfb;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #edf1ef;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-Urgent{background:var(--redl);color:var(--red)}
.p-Top{background:var(--ambl);color:var(--amb)}
.p-Need{background:var(--bluel);color:var(--blue)}
.s-Requested{background:var(--greyl);color:#4a5568}
.s-Sourcing{background:var(--bluel);color:var(--blue)}
.s-Interview{background:var(--purl);color:var(--pur)}
.s-Selected,.s-Offer{background:var(--goldl);color:#8a6420}
.s-Joined{background:var(--gl);color:var(--g2)}
.s-On{background:var(--ambl);color:var(--amb)}
.s-Cancelled{background:#f1f1f1;color:#888}
.serial{font-weight:700;color:var(--g);white-space:nowrap}
.muted{color:var(--mut);font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input{width:auto;min-width:140px}
.filters input[type=text]{flex:1;min-width:180px}
.chk{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:500;margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips label{margin:0;cursor:pointer}
.chips input{display:none}
.chips span{display:inline-block;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);font-weight:600;color:var(--mut);font-size:13px}
.chips input:checked+span.c-Urgent{background:var(--red);border-color:var(--red);color:#fff}
.chips input:checked+span.c-Top{background:var(--amb);border-color:var(--amb);color:#fff}
.chips input:checked+span.c-Need{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,30,25,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:min(820px,100%);height:100%;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.dh h3{margin:0;font-size:17px;color:var(--g)}
.db{padding:16px 18px}
.sec{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.sec h4{margin:0 0 10px;font-size:13.5px;color:var(--g);display:flex;align-items:center;gap:8px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.center{position:fixed;inset:0;background:rgba(15,30,25,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.center .box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:420px}
.hist{border-left:2px solid var(--line);padding-left:12px}
.hist div{margin-bottom:9px;font-size:12.5px}
.hist b{color:var(--g)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:30px;font-weight:600;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.bad{background:var(--red)}
.loading{position:fixed;top:0;left:0;height:3px;background:var(--gold);z-index:100;width:30%;animation:ld 1s infinite linear}
@keyframes ld{0%{left:-30%}100%{left:100%}}
.bars div{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.bars .lb{width:130px;flex:0 0 130px;color:var(--mut)}
.bars .tr{flex:1;background:#eef2f0;border-radius:4px;height:12px;overflow:hidden}
.bars .fl{height:100%;background:var(--g2);border-radius:4px}
.bars .v{width:28px;text-align:right;font-weight:600}
/* mobile table → cards */
@media(max-width:760px){
  .hbar .t small,.who span.e{display:none}
  .rt thead{display:none}
  .rt tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;padding:6px 4px}
  .rt td{display:flex;justify-content:space-between;gap:10px;border:0;padding:5px 10px}
  .rt td::before{content:attr(data-l);font-size:11.5px;color:var(--mut);font-weight:600}
  main{padding:12px}
}
</style>
</head>

const S={token:null,user:null,config:null,branches:[],requests:[],candidates:[],tab:'dash',
  f:{branch:'',status:'',priority:'',q:'',closed:false},users:[]};

/* ---------------- server calls ---------------- */
function run(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args));}
let busy=0;function load(on){busy+=on?1:-1;document.getElementById('loading').classList.toggle('hidden',busy<=0);}
async function call(action,payload){
  load(true);
  try{
    const r=await run('api',S.token,action,payload||{});
    if(!r.ok){if(r.error==='SESSION_EXPIRED'){signOut(true);throw new Error('Your session expired. Please sign in again.');}throw new Error(r.error);}
    return r.data;
  }finally{load(false);}
}
function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem(k);}catch(e){return null;}}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=v=>String(v||'').split(' ')[0];
const pBadge=p=>p?`<span class="badge p-${cls(p)}">${esc(p)}</span>`:'';
const sBadge=s=>s?`<span class="badge s-${cls(s)}">${esc(s)}</span>`:'';
const isHR=()=>S.user&&(S.user.Role==='HR'||S.user.Role==='Admin');
const isAdmin=()=>S.user&&S.user.Role==='Admin';
const myBranches=()=>String(S.user.Branch||'').split(',').map(s=>s.trim()).filter(Boolean);
const bName=c=>{const b=S.branches.find(x=>x.Code===c);return b?b.Name:c;};
const isClosed=r=>S.config.closedStatuses.includes(r.Status);
const candsOf=id=>S.candidates.filter(c=>c.RequestID===id);
function fmtDate(d){if(!d)return'';const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return esc(d);const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return `${+m[3]} ${M[+m[2]-1]} ${m[1]}`;}
function daysBetween(a,b){const d1=new Date(String(a).slice(0,10)),d2=new Date(String(b).slice(0,10));return Math.round((d2-d1)/864e5);}
function age(r){const end=r.ClosedAt||S.config.today;return Math.max(0,daysBetween(r.RequestedAt,end));}
function nextInterview(id){const t=S.config.today;const list=candsOf(id).filter(c=>c.InterviewDate&&c.InterviewDate>=t).sort((a,b)=>(a.InterviewDate+a.InterviewTime).localeCompare(b.InterviewDate+b.InterviewTime));return list[0];}
function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function opts(list,sel,blank){return (blank!=null?`<option value="">${esc(blank)}</option>`:'')+list.map(v=>{const val=typeof v==='object'?v.v:v,lab=typeof v==='object'?v.l:v;return `<option value="${esc(val)}"${String(val)===String(sel)?' selected':''}>${esc(lab)}</option>`;}).join('');}
function formData(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);return o;}
const prioRank={'Urgent':0,'Top Priority':1,'Need':2};

/* ---------------- auth ---------------- */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('#lBtn');btn.disabled=true;$('#loginErr').classList.add('hidden');
  try{
    const r=await run('login',$('#lEmail').value,$('#lPass').value);
    if(!r.ok)throw new Error(r.error);
    S.token=r.data.token;store('rt_token',S.token);await refresh();showApp();
  }catch(err){$('#loginErr').textContent=err.message||err;$('#loginErr').classList.remove('hidden');}
  finally{btn.disabled=false;}
});
function signOut(silent){if(S.token&&!silent)run('logout',S.token).catch(()=>{});S.token=null;store('rt_token',null);$('#app').classList.add('hidden');$('#login').classList.remove('hidden');closeModal();}
$('#outBtn').onclick=()=>signOut();
$('#pwBtn').onclick=()=>pwDialog(false);

async function refresh(){
  const d=await call('bootstrap');
  Object.assign(S,{user:d.user,config:d.config,branches:d.branches,requests:d.requests,candidates:d.candidates});
}
function showApp(){
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#uName').textContent=S.user.Name;$('#uRole').textContent=S.user.Role;
  $('#uBranch').textContent=S.user.Role==='Head'?myBranches().map(bName).join(', '):'All branches';
  renderNav();render();
  if(S.user.MustChange)pwDialog(true);
}

/* ---------------- nav ---------------- */
function renderNav(){
  const tabs=[['dash','Dashboard'],['list','Requests'],['new','+ New Request']];
  if(isAdmin())tabs.push(['admin','Admin']);
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')+
    `<div class="sp"></div><button data-t="refresh" title="Refresh">⟳ Refresh</button>`;
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=async()=>{
    if(b.dataset.t==='refresh'){await refresh();render();toast('Updated');return;}
    S.tab=b.dataset.t;renderNav();render();
  });
}
function go(tab){S.tab=tab;renderNav();render();}
function render(){({dash:renderDash,list:renderList,new:renderNew,admin:renderAdmin}[S.tab])();window.scrollTo(0,0);}

/* ---------------- dashboard ---------------- */
function renderDash(){
  const open=S.requests.filter(r=>!isClosed(r)&&r.Status!=='On Hold');
  const t=S.config.today;const in7=new Date(t);in7.setDate(in7.getDate()+14);const lim=in7.toISOString().slice(0,10);
  const month=t.slice(0,7);
  const upcoming=S.candidates.filter(c=>c.InterviewDate&&c.InterviewDate>=t&&c.InterviewDate<=lim&&!['Rejected','No Show','Declined'].includes(c.Stage))
    .sort((a,b)=>(a.InterviewDate+a.InterviewTime).localeCompare(b.InterviewDate+b.InterviewTime));
  const joined=S.requests.filter(r=>r.Status==='Joined'&&String(r.ClosedAt).slice(0,7)===month).length;
  const vac=open.reduce((s,r)=>s+(+r.Vacancies||1),0);
  const branches=[...new Set(S.requests.map(r=>r.Branch))].sort();
  const rows=branches.map(b=>{const rs=S.requests.filter(r=>r.Branch===b);const op=rs.filter(r=>!isClosed(r));
    return {b,open:op.length,u:op.filter(r=>r.Priority==='Urgent').length,tp:op.filter(r=>r.Priority==='Top Priority').length,n:op.filter(r=>r.Priority==='Need').length,
      iv:op.filter(r=>r.Status==='Interview Scheduled').length,j:rs.filter(r=>r.Status==='Joined').length};});
  const statusCount=S.config.statuses.map(s=>({s,n:S.requests.filter(r=>r.Status===s).length}));
  const maxS=Math.max(1,...statusCount.map(x=>x.n));
  const urgent=open.filter(r=>r.Priority==='Urgent').sort((a,b)=>age(b)-age(a)).slice(0,6);

  $('#view').innerHTML=`
  ${S.branches.length===0&&isAdmin()?`<div class="card" style="border-color:var(--gold);background:var(--goldl)"><b>Welcome!</b> Start by adding your branches and users in the <a href="#" id="toAdmin">Admin</a> tab.</div>`:''}
  <div class="kpis">
    <div class="kpi"><div class="n">${open.length}</div><div class="l">Open requests (${vac} vacancies)</div></div>
    <div class="kpi red"><div class="n">${open.filter(r=>r.Priority==='Urgent').length}</div><div class="l">Urgent open</div></div>
    <div class="kpi blue"><div class="n">${upcoming.length}</div><div class="l">Interviews in next 14 days</div></div>
    <div class="kpi gold"><div class="n">${joined}</div><div class="l">Joined this month</div></div>
  </div>
  <div class="two">
    <div class="card"><h2>Branch-wise summary</h2>
      ${rows.length?`<div style="overflow-x:auto"><table><thead><tr><th>Branch</th><th class="num">Open</th><th class="num">Urgent</th><th class="num">Top</th><th class="num">Need</th><th class="num">Interviews</th><th class="num">Joined</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click" data-b="${esc(r.b)}"><td><b>${esc(bName(r.b))}</b> <span class="muted">${esc(r.b)}</span></td><td class="num">${r.open}</td><td class="num" style="color:var(--red);font-weight:600">${r.u||''}</td><td class="num">${r.tp||''}</td><td class="num">${r.n||''}</td><td class="num">${r.iv||''}</td><td class="num">${r.j||''}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="empty">No requests yet.</div>`}
    </div>
    <div class="card"><h2>Status overview</h2><div class="bars">
      ${statusCount.map(x=>`<div><span class="lb">${esc(x.s)}</span><span class="tr"><span class="fl" style="display:block;width:${x.n/maxS*100}%"></span></span><span class="v">${x.n}</span></div>`).join('')}
    </div></div>
  </div>
  <div class="two">
    <div class="card"><h2>Upcoming interviews</h2>
      ${upcoming.length?`<div style="overflow-x:auto"><table class="rt"><thead><tr><th>Date</th><th>Candidate</th><th>Position</th><th>Branch</th><th>Mode</th></tr></thead><tbody>
      ${upcoming.map(c=>{const r=S.requests.find(x=>x.ID===c.RequestID)||{};return `<tr class="click" data-id="${esc(r.ID)}"><td data-l="Date"><b>${fmtDate(c.InterviewDate)}</b> ${esc(c.InterviewTime)}</td><td data-l="Candidate">${esc(c.Name)}</td><td data-l="Position">${esc(r.Position)} <span class="muted">${esc(r.SerialNo)}</span></td><td data-l="Branch">${esc(bName(r.Branch))}</td><td data-l="Mode">${esc(c.Mode)}</td></tr>`;}).join('')}
      </tbody></table></div>`:`<div class="empty">No interviews scheduled in the next 14 days.</div>`}
    </div>
    <div class="card"><h2>Urgent — oldest first</h2>
      ${urgent.length?urgent.map(r=>`<div class="click" data-id="${esc(r.ID)}" style="padding:8px 0;border-bottom:1px solid #edf1ef;cursor:pointer"><span class="serial">${esc(r.SerialNo)}</span> · <b>${esc(r.Position)}</b><br><span class="muted">${esc(bName(r.Branch))} · ${age(r)} days open · </span>${sBadge(r.Status)}</div>`).join(''):`<div class="empty">No urgent open requests.</div>`}
    </div>
  </div>`;
  const ta=$('#toAdmin');if(ta)ta.onclick=e=>{e.preventDefault();go('admin');};
  $('#view').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openRequest(el.dataset.id));
  $('#view').querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{S.f.branch=el.dataset.b;go('list');});
}

/* ---------------- list ---------------- */
function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase();
  return S.requests.filter(r=>(!f.branch||r.Branch===f.branch)&&(!f.status||r.Status===f.status)&&(!f.priority||r.Priority===f.priority)
    &&(f.closed||f.status||!isClosed(r))
    &&(!q||[r.SerialNo,r.Position,r.Department,r.RequestedByName,r.HRRemarks,...candsOf(r.ID).map(c=>c.Name)].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(isClosed(a)-isClosed(b))||(prioRank[a.Priority]-prioRank[b.Priority])||String(b.RequestedAt).localeCompare(String(a.RequestedAt)));
}
function renderList(){
  const branchOpts=(isHR()?S.branches.map(b=>b.Code):myBranches()).map(c=>({v:c,l:bName(c)+' ('+c+')'}));
  $('#view').innerHTML=`<div class="card">
    <div class="filters">
      <input type="text" id="fq" placeholder="Search serial, position, candidate…" value="${esc(S.f.q)}">
      <select id="fb">${opts(branchOpts,S.f.branch,'All branches')}</select>
      <select id="fs">${opts(S.config.statuses,S.f.status,'All statuses')}</select>
      <select id="fp">${opts(S.config.priorities,S.f.priority,'All priorities')}</select>
      <label class="chk"><input type="checkbox" id="fc" ${S.f.closed?'checked':''}> Show closed</label>
      <button class="btn sec sm" id="csv">⬇ Export CSV</button>
    </div>
    <div id="listBody"></div></div>`;
  const bind=(id,k,ev)=>$(id).addEventListener(ev||'change',e=>{S.f[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;drawRows();});
  bind('#fq','q','input');bind('#fb','branch');bind('#fs','status');bind('#fp','priority');bind('#fc','closed');
  $('#csv').onclick=exportCsv;drawRows();
}
function drawRows(){
  const list=filtered();
  $('#listBody').innerHTML=list.length?`<div style="overflow-x:auto"><table class="rt"><thead><tr><th>Serial</th><th>Branch</th><th>Position</th><th class="num">Vac.</th><th>Priority</th><th>Status</th><th>Candidates</th><th>Next interview</th><th>Requested</th><th class="num">Age</th></tr></thead><tbody>
  ${list.map(r=>{const cs=candsOf(r.ID);const ni=nextInterview(r.ID);return `<tr class="click" data-id="${esc(r.ID)}">
    <td data-l="Serial"><span class="serial">${esc(r.SerialNo)}</span></td>
    <td data-l="Branch">${esc(bName(r.Branch))}</td>
    <td data-l="Position"><b>${esc(r.Position)}</b>${r.Department?`<div class="muted">${esc(r.Department)}</div>`:''}</td>
    <td data-l="Vacancies" class="num">${esc(r.Vacancies)}</td>
    <td data-l="Priority">${pBadge(r.Priority)}</td>
    <td data-l="Status">${sBadge(r.Status)}</td>
    <td data-l="Candidates">${cs.length?esc(cs.map(c=>c.Name).slice(0,3).join(', '))+(cs.length>3?` +${cs.length-3}`:''):'<span class="muted">—</span>'}</td>
    <td data-l="Next interview">${ni?`${fmtDate(ni.InterviewDate)} ${esc(ni.InterviewTime)}`:'<span class="muted">—</span>'}</td>
    <td data-l="Requested">${fmtDate(r.RequestedAt)}<div class="muted">${esc(r.RequestedByName)}</div></td>
    <td data-l="Age (days)" class="num">${age(r)}d</td></tr>`;}).join('')}
  </tbody></table></div><p class="muted" style="margin:10px 0 0">${list.length} request(s)</p>`:`<div class="empty">No requests match these filters.</div>`;
  $('#listBody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openRequest(tr.dataset.id));
}
function exportCsv(){
  const cols=['SerialNo','Branch','Position','Department','Vacancies','Priority','Status','Experience','Qualification','SalaryRange','RequiredBy','RequestedByName','RequestedAt','HRRemarks','UpdatedAt','ClosedAt'];
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines=[cols.concat(['BranchName','Candidates']).join(',')].concat(filtered().map(r=>cols.map(c=>q(r[c])).concat([q(bName(r.Branch)),q(candsOf(r.ID).map(c=>`${c.Name} (${c.Stage}${c.InterviewDate?' '+c.InterviewDate:''})`).join('; '))]).join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download=`recruitment-${S.config.today}.csv`;a.click();
}

/* ---------------- new request ---------------- */
function requestFields(r,editable,hr){
  const dis=editable?'':'disabled';
  const branchList=(hr?S.branches.filter(b=>b.Active===true||b.Active==='TRUE'||b.Code===r.Branch).map(b=>b.Code):myBranches());
  return `<div class="grid">
    <div class="f"><label>Branch *</label><select name="Branch" ${(r.ID&&!hr)||!editable?'disabled':''} required>${opts(branchList.map(c=>({v:c,l:bName(c)+' ('+c+')'})),r.Branch||(branchList.length===1?branchList[0]:''),branchList.length===1?null:'Select branch')}</select></div>
    <div class="f"><label>Position / designation *</label><input type="text" name="Position" value="${esc(r.Position)}" required ${dis} placeholder="e.g. Skin Therapist"></div>
    <div class="f"><label>Department</label><input type="text" name="Department" value="${esc(r.Department)}" ${dis} placeholder="e.g. Clinical, Front desk"></div>
    <div class="f"><label>No. of vacancies</label><input type="number" min="1" name="Vacancies" value="${esc(r.Vacancies||1)}" ${dis}></div>
    <div class="f full"><label>Priority *</label><div class="chips">${S.config.priorities.map(p=>`<label><input type="radio" name="Priority" value="${esc(p)}" ${r.Priority===p?'checked':''} ${dis} required><span class="c-${cls(p)}">${esc(p)}</span></label>`).join('')}</div></div>
    <div class="f"><label>Experience required</label><input type="text" name="Experience" value="${esc(r.Experience)}" ${dis} placeholder="e.g. 2–4 years"></div>
    <div class="f"><label>Qualification</label><input type="text" name="Qualification" value="${esc(r.Qualification)}" ${dis}></div>
    <div class="f"><label>Salary range</label><input type="text" name="SalaryRange" value="${esc(r.SalaryRange)}" ${dis} placeholder="e.g. ₹20k–25k"></div>
    <div class="f"><label>Required by (date)</label><input type="date" name="RequiredBy" value="${esc(r.RequiredBy)}" ${dis}></div>
    <div class="f full"><label>Job description / notes</label><textarea name="Description" ${dis}>${esc(r.Description)}</textarea></div>
  </div>`;
}
function renderNew(){
  if(!isHR()&&!myBranches().length){$('#view').innerHTML=`<div class="card empty">No branch is assigned to your login. Please contact the Admin.</div>`;return;}
  $('#view').innerHTML=`<div class="card" style="max-width:860px"><h2>Request a new position</h2>
    <p class="muted" style="margin-top:-6px">A branch-wise serial number is generated automatically when you submit.</p>
    <form id="newForm">${requestFields({},true,isHR())}
    <div id="newErr" class="err hidden"></div>
    <button class="btn">Submit request</button></form></div>`;
  $('#newForm').onsubmit=async e=>{
    e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;$('#newErr').classList.add('hidden');
    try{const p=formData(e.target);if(!p.Branch)p.Branch=e.target.Branch.value;const r=await call('createRequest',p);await refresh();toast('Request '+r.serial+' created');go('list');}
    catch(err){$('#newErr').textContent=err.message;$('#newErr').classList.remove('hidden');btn.disabled=false;}
  };
}

/* ---------------- request detail ---------------- */
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow='';}
async function openRequest(id){
  const r=S.requests.find(x=>x.ID===id);if(!r)return;
  const hr=isHR();const canEdit=hr||!isClosed(r);
  document.body.style.overflow='hidden';
  $('#modal').innerHTML=`<div class="ov" id="ov"><div class="drawer">
    <div class="dh"><div style="flex:1"><div class="serial" style="font-size:13px">${esc(r.SerialNo)} · ${esc(bName(r.Branch))}</div><h3>${esc(r.Position)}</h3>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${pBadge(r.Priority)} ${sBadge(r.Status)} <span class="muted">Raised by ${esc(r.RequestedByName)} on ${fmtDate(r.RequestedAt)} · ${age(r)} days</span></div></div>
      <button class="x" id="xBtn">×</button></div>
    <div class="db">
      ${hr?`<form class="sec" id="hrForm" style="background:#fbfaf6;border-color:#eadfc8"><h4>HR status update</h4><div class="grid">
        <div class="f"><label>Serial number</label><input type="text" name="SerialNo" value="${esc(r.SerialNo)}"></div>
        <div class="f"><label>Status</label><select name="Status">${opts(S.config.statuses,r.Status)}</select></div>
        <div class="f full"><label>HR remarks (visible to branch head)</label><textarea name="HRRemarks">${esc(r.HRRemarks)}</textarea></div></div>
        <button class="btn gold">Save status</button></form>`
      :(r.HRRemarks?`<div class="sec" style="background:#fbfaf6"><h4>HR remarks</h4>${esc(r.HRRemarks)}</div>`:'')}
      <div class="sec"><h4>Candidates &amp; interviews ${hr?`<span class="sp"></span><button class="btn sm" id="addCand">+ Add candidate</button>`:''}</h4>
        <div id="candBox"></div><div id="candForm"></div></div>
      <form class="sec" id="reqForm"><h4>Request details ${!canEdit?'<span class="muted">(closed – read only)</span>':''}</h4>
        ${requestFields(r,canEdit,hr)}
        ${canEdit?`<button class="btn sec">Save details</button>`:''}
        ${isAdmin()?`<button type="button" class="btn danger" id="delReq" style="float:right">Delete request</button>`:''}
      </form>
      <div class="sec"><h4>Activity history</h4><div id="hist" class="muted">Loading…</div></div>
    </div></div></div>`;
  $('#ov').onclick=e=>{if(e.target.id==='ov')closeModal();};$('#xBtn').onclick=closeModal;
  drawCands(r);
  const save=async(p,msg)=>{try{const res=await call('updateRequest',Object.assign({ID:r.ID},p));await refresh();toast(res.changed?msg:'No changes');reopen(r.ID);}catch(err){toast(err.message,true);}};
  if(hr)$('#hrForm').onsubmit=e=>{e.preventDefault();save(formData(e.target),'Status updated');};
  if(canEdit)$('#reqForm').onsubmit=e=>{e.preventDefault();const p=formData(e.target);if(!hr)delete p.Branch;save(p,'Details saved');};
  if(hr)$('#addCand').onclick=()=>candidateForm(r,{});
  const dr=$('#delReq');if(dr)dr.onclick=async()=>{if(!confirmBox('Delete '+r.SerialNo+' and its candidates permanently?'))return;try{await call('deleteRequest',{ID:r.ID});await refresh();closeModal();render();toast('Deleted');}catch(err){toast(err.message,true);}};
  try{const h=await call('getHistory',{ID:r.ID});$('#hist').innerHTML=h.length?`<div class="hist">${h.map(x=>`<div><b>${esc(x.Action)}</b> · ${esc(x.At)} · ${esc(x.User)}<br>${esc(x.Details)}</div>`).join('')}</div>`:'No history yet.';}
  catch(err){$('#hist').textContent=err.message;}
}
function confirmBox(msg){return window.confirm(msg);}
function reopen(id){render();openRequest(id);}
function drawCands(r){
  const cs=candsOf(r.ID).sort((a,b)=>String(a.InterviewDate||'9').localeCompare(String(b.InterviewDate||'9')));
  $('#candBox').innerHTML=cs.length?`<div style="overflow-x:auto"><table class="rt"><thead><tr><th>Candidate</th><th>Interview</th><th>Mode</th><th>Stage</th><th>Remarks</th>${isHR()?'<th></th>':''}</tr></thead><tbody>
    ${cs.map(c=>`<tr><td data-l="Candidate"><b>${esc(c.Name)}</b><div class="muted">${esc(c.Phone)} ${esc(c.Email)}</div></td>
      <td data-l="Interview">${c.InterviewDate?`${fmtDate(c.InterviewDate)} ${esc(c.InterviewTime)}`:'<span class="muted">—</span>'}${c.Interviewer?`<div class="muted">with ${esc(c.Interviewer)}</div>`:''}</td>
      <td data-l="Mode">${esc(c.Mode)}</td><td data-l="Stage">${sBadge(c.Stage==='Interview Scheduled'?'Interview Scheduled':c.Stage)}</td>
      <td data-l="Remarks">${esc(c.Remarks)}</td>
      ${isHR()?`<td><button class="btn sec sm" data-e="${esc(c.ID)}">Edit</button></td>`:''}</tr>`).join('')}
    </tbody></table></div>`:`<div class="muted">No candidates added yet.</div>`;
  $('#candBox').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>candidateForm(r,S.candidates.find(c=>c.ID===b.dataset.e)));
}
function candidateForm(r,c){
  $('#candForm').innerHTML=`<form id="cf" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)"><div class="grid">
    <div class="f"><label>Candidate name *</label><input type="text" name="Name" value="${esc(c.Name)}" required></div>
    <div class="f"><label>Phone</label><input type="text" name="Phone" value="${esc(c.Phone)}"></div>
    <div class="f"><label>Email</label><input type="text" name="Email" value="${esc(c.Email)}"></div>
    <div class="f"><label>Interview date</label><input type="date" name="InterviewDate" value="${esc(c.InterviewDate)}"></div>
    <div class="f"><label>Interview time</label><input type="time" name="InterviewTime" value="${esc(c.InterviewTime)}"></div>
    <div class="f"><label>Mode</label><select name="Mode">${opts(S.config.modes,c.Mode,'—')}</select></div>
    <div class="f"><label>Interviewer</label><input type="text" name="Interviewer" value="${esc(c.Interviewer)}"></div>
    <div class="f"><label>Stage</label><select name="Stage">${opts(S.config.stages,c.Stage,'Auto')}</select></div>
    <div class="f full"><label>Remarks</label><input type="text" name="Remarks" value="${esc(c.Remarks)}"></div></div>
    <button class="btn">${c.ID?'Update candidate':'Add candidate'}</button> <button type="button" class="btn sec" id="cfCancel">Cancel</button>
    ${c.ID?`<button type="button" class="btn danger" id="cfDel" style="float:right">Remove</button>`:''}</form>`;
  $('#cfCancel').onclick=()=>$('#candForm').innerHTML='';
  $('#cf').onsubmit=async e=>{e.preventDefault();try{await call('saveCandidate',Object.assign(formData(e.target),{ID:c.ID||'',RequestID:r.ID}));await refresh();toast('Candidate saved');reopen(r.ID);}catch(err){toast(err.message,true);}};
  const d=$('#cfDel');if(d)d.onclick=async()=>{if(!confirmBox('Remove '+c.Name+'?'))return;try{await call('deleteCandidate',{ID:c.ID});await refresh();toast('Removed');reopen(r.ID);}catch(err){toast(err.message,true);}};
  $('#cf').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------------- admin ---------------- */
async function renderAdmin(){
  $('#view').innerHTML=`<div class="two">
    <div class="card"><h2>Branches</h2><div id="brTable"></div><div id="brForm" style="margin-top:12px"></div></div>
    <div class="card"><h2>Users &amp; access</h2><div id="usTable" class="muted">Loading…</div><div id="usForm" style="margin-top:12px"></div></div></div>`;
  drawBranches();
  try{S.users=await call('listUsers');drawUsers();}catch(e){$('#usTable').textContent=e.message;}
}
function drawBranches(){
  $('#brTable').innerHTML=(S.branches.length?`<table class="rt"><thead><tr><th>Code</th><th>Name</th><th class="num">Next serial</th><th>Active</th><th></th></tr></thead><tbody>
    ${S.branches.map(b=>`<tr><td data-l="Code"><b>${esc(b.Code)}</b></td><td data-l="Name">${esc(b.Name)}<div class="muted">${esc(b.Location)}</div></td><td data-l="Next serial" class="num">${esc(b.Code)}-${String(b.NextSerial||1).padStart(3,'0')}</td><td data-l="Active">${String(b.Active).toUpperCase()==='TRUE'?'Yes':'No'}</td><td><button class="btn sec sm" data-b="${esc(b.Code)}">Edit</button></td></tr>`).join('')}
    </tbody></table>`:`<div class="muted">No branches yet.</div>`)+`<button class="btn sm" id="addBr" style="margin-top:10px">+ Add branch</button>`;
  $('#addBr').onclick=()=>branchForm({});
  $('#brTable').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>branchForm(S.branches.find(x=>x.Code===b.dataset.b)));
}
function branchForm(b){
  const isNew=!b.Code;
  $('#brForm').innerHTML=`<form id="bf" class="sec"><h4>${isNew?'Add branch':'Edit '+esc(b.Code)}</h4><div class="grid">
    <div class="f"><label>Code (used in serial no.)</label><input type="text" name="Code" value="${esc(b.Code)}" ${isNew?'':'disabled'} required placeholder="e.g. CHN" maxlength="8"></div>
    <div class="f"><label>Branch name</label><input type="text" name="Name" value="${esc(b.Name)}" required></div>
    <div class="f"><label>Location</label><input type="text" name="Location" value="${esc(b.Location)}"></div>
    <div class="f"><label>Next serial number</label><input type="number" min="1" name="NextSerial" value="${esc(b.NextSerial||1)}"></div>
    ${isNew?'':`<div class="f"><label>Active</label><select name="Active">${opts([{v:'TRUE',l:'Yes'},{v:'FALSE',l:'No'}],String(b.Active).toUpperCase())}</select></div>`}
    </div><button class="btn">Save branch</button> <button type="button" class="btn sec" id="bfc">Cancel</button></form>`;
  $('#bfc').onclick=()=>$('#brForm').innerHTML='';
  $('#bf').onsubmit=async e=>{e.preventDefault();const p=formData(e.target);if(!isNew)p.Code=b.Code;p.isNew=isNew;
    try{await call('saveBranch',p);await refresh();drawBranches();$('#brForm').innerHTML='';toast('Branch saved');}catch(err){toast(err.message,true);}};
}
function drawUsers(){
  $('#usTable').innerHTML=`<table class="rt"><thead><tr><th>User</th><th>Role</th><th>Branch</th><th>Active</th><th></th></tr></thead><tbody>
    ${S.users.map((u,i)=>`<tr><td data-l="User"><b>${esc(u.Name)}</b><div class="muted">${esc(u.Email)}</div></td><td data-l="Role">${esc(u.Role)}</td><td data-l="Branch">${esc(u.Branch||'All')}</td><td data-l="Active">${u.Active?'Yes':'No'}</td><td><button class="btn sec sm" data-u="${i}">Edit</button></td></tr>`).join('')}
    </tbody></table><button class="btn sm" id="addUs" style="margin-top:10px">+ Add user</button>`;
  $('#addUs').onclick=()=>userForm({Role:'Head',Active:true});
  $('#usTable').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>userForm(S.users[+b.dataset.u]));
}
function userForm(u){
  const isNew=!u.Email;const sel=String(u.Branch||'').split(',');
  $('#usForm').innerHTML=`<form id="uf" class="sec"><h4>${isNew?'Add user':'Edit '+esc(u.Name)}</h4><div class="grid">
    <div class="f"><label>Name</label><input type="text" name="Name" value="${esc(u.Name)}" required></div>
    <div class="f"><label>Email (login)</label><input type="email" name="Email" value="${esc(u.Email)}" ${isNew?'':'disabled'} required></div>
    <div class="f"><label>Role</label><select name="Role" id="ufRole">${opts(S.config.roles,u.Role)}</select></div>
    ${isNew?'':`<div class="f"><label>Active</label><select name="Active">${opts([{v:'TRUE',l:'Yes'},{v:'FALSE',l:'No'}],u.Active?'TRUE':'FALSE')}</select></div>`}
    <div class="f full" id="ufBr"><label>Branch(es) for branch head</label><div class="chips" style="gap:12px">${S.branches.map(b=>`<label class="chk"><input type="checkbox" name="br" value="${esc(b.Code)}" ${sel.includes(b.Code)?'checked':''} style="display:inline"> ${esc(b.Name)} (${esc(b.Code)})</label>`).join('')||'<span class="muted">Add branches first.</span>'}</div></div>
    <div class="f full"><label>${isNew?'Temporary password':'Reset password (leave blank to keep)'}</label><input type="text" name="Password" ${isNew?'required minlength="6"':''} placeholder="min 6 characters – user changes it at first login"></div>
    </div><button class="btn">Save user</button> <button type="button" class="btn sec" id="ufc">Cancel</button></form>`;
  const tg=()=>$('#ufBr').style.display=$('#ufRole').value==='Head'?'':'none';$('#ufRole').onchange=tg;tg();
  $('#ufc').onclick=()=>$('#usForm').innerHTML='';
  $('#uf').onsubmit=async e=>{e.preventDefault();const f=e.target;const p=formData(f);delete p.br;
    p.Branch=p.Role==='Head'?[...f.querySelectorAll('input[name=br]:checked')].map(x=>x.value).join(','):'';
    if(!isNew)p.Email=u.Email;p.isNew=isNew;
    try{await call('saveUser',p);S.users=await call('listUsers');drawUsers();$('#usForm').innerHTML='';toast('User saved');}catch(err){toast(err.message,true);}};
}

/* ---------------- password ---------------- */
function pwDialog(forced){
  $('#modal').innerHTML=`<div class="center"><form class="box" id="pwf"><h3 style="margin:0 0 6px;color:var(--g)">${forced?'Set your own password':'Change password'}</h3>
    ${forced?'<p class="muted" style="margin:0 0 12px">For security, please replace the temporary password.</p>':''}
    <div id="pwErr" class="err hidden"></div>
    <div class="f"><label>Current password</label><input type="password" name="current" required></div>
    <div class="f"><label>New password</label><input type="password" name="next" required minlength="6"></div>
    <div class="f"><label>Confirm new password</label><input type="password" name="again" required></div>
    <button class="btn">Update password</button> ${forced?'':'<button type="button" class="btn sec" id="pwc">Cancel</button>'}</form></div>`;
  const c=$('#pwc');if(c)c.onclick=closeModal;
  $('#pwf').onsubmit=async e=>{e.preventDefault();const p=formData(e.target);
    try{if(p.next!==p.again)throw new Error('New passwords do not match.');await call('changePassword',{current:p.current,next:p.next});S.user.MustChange=false;closeModal();toast('Password updated');}
    catch(err){$('#pwErr').textContent=err.message;$('#pwErr').classList.remove('hidden');}};
}

/* ---------------- start ---------------- */
(async function(){
  const t=recall('rt_token');
  if(t){S.token=t;try{await refresh();showApp();}catch(e){S.token=null;store('rt_token',null);}}
  setInterval(async()=>{if(S.token&&document.visibilityState==='visible'&&!$('#modal').innerHTML){try{await refresh();if(['dash','list'].includes(S.tab))render();}catch(e){}}},180000);
})();
</script>
</body>
</html>
